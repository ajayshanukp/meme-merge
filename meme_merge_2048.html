<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meme Merge 2048</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #16213e 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Background particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* Game container */
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* Canvas */
        #gameCanvas {
            border-radius: 0 0 20px 20px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.2), inset 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* UI Panel */
        .ui-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 255, 255, 0.1);
            z-index: 10;
        }

        .score-box {
            text-align: center;
        }

        .score-label {
            font-size: 10px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .next-ball-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .next-ball-label {
            font-size: 10px;
            color: #ff00ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .next-ball-preview {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 0, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 255, 0.3); }
            50% { transform: scale(1.1); box-shadow: 0 0 30px rgba(255, 0, 255, 0.6); }
        }

        .sound-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, 0.5);
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sound-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .sound-btn.muted {
            border-color: rgba(255, 0, 0, 0.5);
            color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
        }

        /* Screens */
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .screen-title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: bold;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #ffff00, #00ffff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s infinite linear;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            margin-bottom: 20px;
            text-align: center;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .tier-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tier-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .tier-emoji {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid;
        }

        .tier-value {
            font-size: 10px;
            color: #888;
        }

        .instructions {
            color: #aaa;
            text-align: center;
            max-width: 400px;
            padding: 0 20px;
            margin: 20px 0;
            line-height: 1.6;
        }

        .btn {
            padding: 15px 50px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.8);
        }

        .game-over-stats {
            text-align: center;
            margin: 20px 0;
        }

        .stat-row {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin: 10px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
        }

        .stat-value.high-score {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* Danger warning */
        .danger-warning {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff0000;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: danger-blink 0.5s infinite;
            opacity: 0;
            z-index: 5;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        .danger-warning.active {
            opacity: 1;
        }

        @keyframes danger-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .ui-panel {
                padding: 10px 15px;
                gap: 10px;
            }
            .score-value {
                font-size: 18px;
            }
            .next-ball-preview {
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            .sound-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Background particles -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- Game Container -->
    <div id="gameContainer">
        <!-- UI Panel -->
        <div class="ui-panel" id="uiPanel" style="display: none;">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-value" id="scoreDisplay">0</div>
            </div>
            <div class="next-ball-box">
                <div class="next-ball-label">Next</div>
                <div class="next-ball-preview" id="nextBallPreview">😀</div>
            </div>
            <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
        </div>

        <div class="danger-warning" id="dangerWarning">⚠️ Danger Zone! ⚠️</div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Start Screen -->
    <div class="screen" id="startScreen">
        <h1 class="screen-title">Meme Merge 2048</h1>
        <div class="tier-preview" id="tierPreview"></div>
        <div class="instructions">
            <p>🎮 <strong>How to Play:</strong></p>
            <p>Drag to aim • Click/Tap to drop</p>
            <p>Merge identical emojis to create higher tiers!</p>
            <p>Don't let balls stay above the danger line!</p>
        </div>
        <button class="btn btn-primary" onclick="startGame()">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div class="screen hidden" id="gameOverScreen">
        <h1 class="screen-title">Game Over</h1>
        <div class="game-over-stats">
            <div class="stat-row">
                <div class="stat-item">
                    <div class="stat-label">Final Score</div>
                    <div class="stat-value" id="finalScore">0</div>
                </div>
            </div>
            <div class="stat-row">
                <div class="stat-item">
                    <div class="stat-label">High Score</div>
                    <div class="stat-value high-score" id="highScoreDisplay">0</div>
                </div>
            </div>
        </div>
        <button class="btn btn-primary" onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // ==================== GAME CONFIGURATION ====================
        const EMOJI_TIERS = [
            { emoji: '😀', value: 2, radius: 15, color: '#ff6b6b' },
            { emoji: '😎', value: 4, radius: 20, color: '#4ecdc4' },
            { emoji: '🤔', value: 8, radius: 25, color: '#45b7d1' },
            { emoji: '😱', value: 16, radius: 30, color: '#96ceb4' },
            { emoji: '🤯', value: 32, radius: 35, color: '#feca57' },
            { emoji: '👽', value: 64, radius: 40, color: '#ff9ff3' },
            { emoji: '👾', value: 128, radius: 45, color: '#54a0ff' },
            { emoji: '🤖', value: 256, radius: 50, color: '#5f27cd' },
            { emoji: '👻', value: 512, radius: 55, color: '#00d2d3' },
            { emoji: '💀', value: 1024, radius: 60, color: '#ff9f43' },
            { emoji: '🔥', value: 2048, radius: 65, color: '#ee5a24' },
            { emoji: '💎', value: 4096, radius: 70, color: '#0abde3' },
            { emoji: '👑', value: 8192, radius: 75, color: '#ffd700' }
        ];

        const GAME_CONFIG = {
            canvasWidth: Math.min(450, window.innerWidth - 20),
            canvasHeight: Math.min(700, window.innerHeight - 100),
            wallThickness: 20,
            dangerLineHeight: 120,
            dangerTime: 3000,
            maxNextTier: 4,
            dropCooldown: 500,
            autoSaveInterval: 3000
        };

        // ==================== AUDIO SYSTEM ====================
        const AudioSys = {
            ctx: null,
            enabled: true,
            init() {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Audio not supported');
                }
            },
            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playDrop() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            },
            playMerge() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            },
            playGameOver() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }
        };

        // ==================== PARTICLE SYSTEM ====================
        const ParticleSys = {
            particles: [],
            create(x, y, color, count = 10) {
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count;
                    const speed = 3 + Math.random() * 4;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        color,
                        size: 3 + Math.random() * 4
                    });
                }
            },
            update() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.life -= 0.03;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
            },
            draw(ctx) {
                this.particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }
        };

        // ==================== SCREEN SHAKE ====================
        const ScreenShake = {
            intensity: 0,
            trigger(amount = 10) {
                this.intensity = amount;
            },
            update() {
                if (this.intensity > 0) {
                    this.intensity *= 0.9;
                    if (this.intensity < 0.5) this.intensity = 0;
                }
            },
            getOffset() {
                if (this.intensity === 0) return { x: 0, y: 0 };
                return {
                    x: (Math.random() - 0.5) * this.intensity,
                    y: (Math.random() - 0.5) * this.intensity
                };
            }
        };

        // ==================== LOCAL STORAGE ====================
        const Storage = {
            key: 'memeMerge2048',
            save(gameState) {
                try {
                    localStorage.setItem(this.key, JSON.stringify(gameState));
                } catch (e) {
                    console.log('Save failed');
                }
            },
            load() {
                try {
                    const data = localStorage.getItem(this.key);
                    return data ? JSON.parse(data) : null;
                } catch (e) {
                    return null;
                }
            },
            clear() {
                localStorage.removeItem(this.key);
            }
        };

        // ==================== GAME STATE ====================
        const Game = {
            engine: null,
            world: null,
            canvas: null,
            ctx: null,
            balls: [],
            score: 0,
            highScore: 0,
            nextTier: 0,
            isPlaying: false,
            canDrop: true,
            lastDropTime: 0,
            aimX: 0,
            dangerBalls: new Map(),
            walls: [],
            ground: null,
            animationId: null,
            autoSaveTimer: null,
            lastSaveTime: 0,

            init() {
                // Setup canvas
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();

                // Setup Matter.js
                this.engine = Matter.Engine.create();
                this.world = this.engine.world;
                this.engine.gravity.y = 1.2;

                // Create boundaries
                this.createBoundaries();

                // Setup collision detection
                Matter.Events.on(this.engine, 'collisionStart', (e) => this.handleCollisions(e));

                // Load saved data
                this.loadGame();

                // Setup input
                this.setupInput();

                // Start render loop
                this.render();

                // Start auto-save
                this.autoSaveTimer = setInterval(() => this.autoSave(), GAME_CONFIG.autoSaveInterval);

                // Create background particles
                this.createBgParticles();
            },

            resize() {
                const maxWidth = Math.min(450, window.innerWidth - 20);
                const maxHeight = Math.min(700, window.innerHeight - 100);
                GAME_CONFIG.canvasWidth = maxWidth;
                GAME_CONFIG.canvasHeight = maxHeight;
                this.canvas.width = maxWidth;
                this.canvas.height = maxHeight;
            },

            createBoundaries() {
                const { canvasWidth, canvasHeight, wallThickness } = GAME_CONFIG;
                const wallOptions = { 
                    isStatic: true, 
                    render: { visible: false },
                    friction: 0.1,
                    restitution: 0.2
                };

                // Left wall
                this.walls[0] = Matter.Bodies.rectangle(
                    wallThickness / 2, canvasHeight / 2,
                    wallThickness, canvasHeight,
                    wallOptions
                );

                // Right wall
                this.walls[1] = Matter.Bodies.rectangle(
                    canvasWidth - wallThickness / 2, canvasHeight / 2,
                    wallThickness, canvasHeight,
                    wallOptions
                );

                // Ground
                this.ground = Matter.Bodies.rectangle(
                    canvasWidth / 2, canvasHeight + wallThickness / 2,
                    canvasWidth, wallThickness,
                    { ...wallOptions, friction: 0.5 }
                );

                Matter.Composite.add(this.world, [...this.walls, this.ground]);
            },

            createBall(x, y, tier, isStatic = false) {
                const config = EMOJI_TIERS[tier];
                const ball = Matter.Bodies.circle(x, y, config.radius, {
                    restitution: 0.3,
                    friction: 0.1,
                    frictionAir: 0.01,
                    density: 0.001,
                    isStatic,
                    label: `ball_${tier}`
                });

                ball.gameTier = tier;
                ball.gameValue = config.value;
                ball.gameEmoji = config.emoji;
                ball.gameColor = config.color;
                ball.gameRadius = config.radius;

                return ball;
            },

            dropBall() {
                if (!this.isPlaying || !this.canDrop) return;

                const now = Date.now();
                if (now - this.lastDropTime < GAME_CONFIG.dropCooldown) return;

                AudioSys.resume();
                AudioSys.playDrop();

                const x = Math.max(
                    GAME_CONFIG.wallThickness + EMOJI_TIERS[this.nextTier].radius,
                    Math.min(
                        GAME_CONFIG.canvasWidth - GAME_CONFIG.wallThickness - EMOJI_TIERS[this.nextTier].radius,
                        this.aimX
                    )
                );

                const ball = this.createBall(x, EMOJI_TIERS[this.nextTier].radius + 10, this.nextTier);
                Matter.Composite.add(this.world, ball);
                this.balls.push(ball);

                this.score += EMOJI_TIERS[this.nextTier].value;
                this.updateScore();

                this.lastDropTime = now;
                this.canDrop = false;

                // Generate next tier
                this.nextTier = Math.floor(Math.random() * GAME_CONFIG.maxNextTier);
                this.updateNextBallPreview();

                // Re-enable drop after cooldown
                setTimeout(() => {
                    this.canDrop = true;
                }, GAME_CONFIG.dropCooldown);

                this.saveGame();
            },

            handleCollisions(event) {
                const pairs = event.pairs;
                const merged = new Set();

                for (const pair of pairs) {
                    const bodyA = pair.bodyA;
                    const bodyB = pair.bodyB;

                    if (merged.has(bodyA.id) || merged.has(bodyB.id)) continue;

                    if (bodyA.label.startsWith('ball_') && bodyB.label.startsWith('ball_')) {
                        if (bodyA.gameTier === bodyB.gameTier && bodyA.gameTier < EMOJI_TIERS.length - 1) {
                            this.mergeBalls(bodyA, bodyB);
                            merged.add(bodyA.id);
                            merged.add(bodyB.id);
                        }
                    }
                }
            },

            mergeBalls(ballA, ballB) {
                const newTier = ballA.gameTier + 1;
                const midX = (ballA.position.x + ballB.position.x) / 2;
                const midY = (ballA.position.y + ballB.position.y) / 2;

                // Remove old balls
                Matter.Composite.remove(this.world, [ballA, ballB]);
                this.balls = this.balls.filter(b => b !== ballA && b !== ballB);

                // Create new ball
                const newBall = this.createBall(midX, midY, newTier);
                Matter.Composite.add(this.world, newBall);
                this.balls.push(newBall);

                // Effects
                ParticleSys.create(midX, midY, EMOJI_TIERS[newTier].color, 20);
                ScreenShake.trigger(15);
                AudioSys.playMerge();

                // Update score
                this.score += EMOJI_TIERS[newTier].value;
                this.updateScore();

                this.saveGame();
            },

            setupInput() {
                const handleMove = (x) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.aimX = x - rect.left;
                };

                const handleEnd = () => {
                    if (this.isPlaying) this.dropBall();
                };

                // Mouse
                this.canvas.addEventListener('mousemove', (e) => handleMove(e.clientX));
                this.canvas.addEventListener('mousedown', handleEnd);

                // Touch
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    handleMove(e.touches[0].clientX);
                }, { passive: false });
                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    handleEnd();
                });
            },

            update() {
                if (!this.isPlaying) return;

                Matter.Engine.update(this.engine, 1000 / 60);
                ParticleSys.update();
                ScreenShake.update();

                // Check danger line
                this.checkDangerLine();

                // Update ball positions for rendering
                this.balls.forEach(ball => {
                    ball.renderX = ball.position.x;
                    ball.renderY = ball.position.y;
                });
            },

            checkDangerLine() {
                const dangerY = GAME_CONFIG.dangerLineHeight;
                const now = Date.now();
                let hasDangerBall = false;

                this.balls.forEach(ball => {
                    if (ball.position.y < dangerY && Math.abs(ball.velocity.y) < 0.5) {
                        if (!this.dangerBalls.has(ball.id)) {
                            this.dangerBalls.set(ball.id, now);
                        } else {
                            const dangerStart = this.dangerBalls.get(ball.id);
                            if (now - dangerStart > GAME_CONFIG.dangerTime) {
                                this.gameOver();
                            }
                        }
                        hasDangerBall = true;
                    } else {
                        this.dangerBalls.delete(ball.id);
                    }
                });

                // Update danger warning
                const warning = document.getElementById('dangerWarning');
                let minDangerTime = Infinity;
                this.dangerBalls.forEach(time => {
                    minDangerTime = Math.min(minDangerTime, now - time);
                });

                if (minDangerTime < 2000 && hasDangerBall) {
                    warning.classList.add('active');
                } else {
                    warning.classList.remove('active');
                }
            },

            render() {
                const ctx = this.ctx;
                const { canvasWidth, canvasHeight, dangerLineHeight, wallThickness } = GAME_CONFIG;

                // Clear canvas
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);

                // Apply screen shake
                const shake = ScreenShake.getOffset();
                ctx.save();
                ctx.translate(shake.x, shake.y);

                // Draw container background
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                // Draw danger line
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.moveTo(wallThickness, dangerLineHeight);
                ctx.lineTo(canvasWidth - wallThickness, dangerLineHeight);
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw walls with glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00ffff';
                ctx.fillStyle = 'rgba(0, 255, 255, 0.2)';
                ctx.fillRect(0, 0, wallThickness, canvasHeight);
                ctx.fillRect(canvasWidth - wallThickness, 0, wallThickness, canvasHeight);
                ctx.fillRect(0, canvasHeight - wallThickness, canvasWidth, wallThickness);
                ctx.shadowBlur = 0;

                // Draw balls
                this.balls.forEach(ball => {
                    const x = ball.position.x;
                    const y = ball.position.y;
                    const r = ball.gameRadius;

                    // Glow effect
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = ball.gameColor;

                    // Ball body
                    const gradient = ctx.createRadialGradient(x - r/3, y - r/3, 0, x, y, r);
                    gradient.addColorStop(0, ball.gameColor);
                    gradient.addColorStop(1, this.darkenColor(ball.gameColor, 0.5));

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();

                    // Emoji
                    ctx.shadowBlur = 0;
                    ctx.font = `${r * 1.2}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(ball.gameEmoji, x, y);
                });

                // Draw aiming indicator
                if (this.isPlaying && this.canDrop) {
                    const config = EMOJI_TIERS[this.nextTier];
                    const x = Math.max(
                        wallThickness + config.radius,
                        Math.min(canvasWidth - wallThickness - config.radius, this.aimX)
                    );
                    const y = config.radius + 10;

                    ctx.globalAlpha = 0.5;
                    ctx.fillStyle = config.color;
                    ctx.beginPath();
                    ctx.arc(x, y, config.radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.font = `${config.radius * 1.2}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.globalAlpha = 0.7;
                    ctx.fillText(config.emoji, x, y);
                    ctx.globalAlpha = 1;

                    // Aiming line
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(x, y + config.radius);
                    ctx.lineTo(x, canvasHeight);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Draw particles
                ParticleSys.draw(ctx);

                ctx.restore();

                // Update and next frame
                this.update();
                this.animationId = requestAnimationFrame(() => this.render());
            },

            darkenColor(color, factor) {
                const hex = color.replace('#', '');
                const r = Math.floor(parseInt(hex.substr(0, 2), 16) * (1 - factor));
                const g = Math.floor(parseInt(hex.substr(2, 2), 16) * (1 - factor));
                const b = Math.floor(parseInt(hex.substr(4, 2), 16) * (1 - factor));
                return `rgb(${r}, ${g}, ${b})`;
            },

            updateScore() {
                document.getElementById('scoreDisplay').textContent = this.score.toLocaleString();
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                }
            },

            updateNextBallPreview() {
                const preview = document.getElementById('nextBallPreview');
                const config = EMOJI_TIERS[this.nextTier];
                preview.textContent = config.emoji;
                preview.style.borderColor = config.color;
                preview.style.boxShadow = `0 0 20px ${config.color}80`;
            },

            start() {
                this.isPlaying = true;
                this.canDrop = true;
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('uiPanel').style.display = 'flex';
                AudioSys.init();
                AudioSys.resume();
            },

            gameOver() {
                this.isPlaying = false;
                AudioSys.playGameOver();

                document.getElementById('finalScore').textContent = this.score.toLocaleString();
                document.getElementById('highScoreDisplay').textContent = this.highScore.toLocaleString();
                document.getElementById('gameOverScreen').classList.remove('hidden');
                document.getElementById('uiPanel').style.display = 'none';
                document.getElementById('dangerWarning').classList.remove('active');

                Storage.clear();
            },

            restart() {
                // Clear all balls
                this.balls.forEach(ball => Matter.Composite.remove(this.world, ball));
                this.balls = [];
                this.dangerBalls.clear();

                // Reset score
                this.score = 0;
                this.nextTier = Math.floor(Math.random() * GAME_CONFIG.maxNextTier);
                this.updateScore();
                this.updateNextBallPreview();

                // Start game
                this.start();
                this.saveGame();
            },

            saveGame() {
                const gameState = {
                    score: this.score,
                    highScore: this.highScore,
                    nextTier: this.nextTier,
                    balls: this.balls.map(ball => ({
                        x: ball.position.x,
                        y: ball.position.y,
                        tier: ball.gameTier
                    }))
                };
                Storage.save(gameState);
                this.lastSaveTime = Date.now();
            },

            autoSave() {
                if (this.isPlaying && Date.now() - this.lastSaveTime > 2000) {
                    this.saveGame();
                }
            },

            loadGame() {
                const saved = Storage.load();
                if (saved) {
                    this.score = saved.score || 0;
                    this.highScore = saved.highScore || 0;
                    this.nextTier = saved.nextTier || 0;

                    // Restore balls
                    if (saved.balls) {
                        saved.balls.forEach(ballData => {
                            const ball = this.createBall(ballData.x, ballData.y, ballData.tier);
                            Matter.Composite.add(this.world, ball);
                            this.balls.push(ball);
                        });
                    }

                    this.updateScore();
                    this.updateNextBallPreview();
                } else {
                    this.nextTier = Math.floor(Math.random() * GAME_CONFIG.maxNextTier);
                    this.updateNextBallPreview();
                }
            },

            createBgParticles() {
                const container = document.getElementById('bgParticles');
                for (let i = 0; i < 30; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'bg-particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 15 + 's';
                    particle.style.animationDuration = (10 + Math.random() * 10) + 's';

                    const colors = ['rgba(0, 255, 255, 0.3)', 'rgba(255, 0, 255, 0.3)', 'rgba(255, 255, 0, 0.3)'];
                    particle.style.background = colors[Math.floor(Math.random() * colors.length)];

                    container.appendChild(particle);
                }
            }
        };

        // ==================== UI FUNCTIONS ====================
        function startGame() {
            Game.start();
        }

        function restartGame() {
            Game.restart();
        }

        function toggleSound() {
            AudioSys.enabled = !AudioSys.enabled;
            const btn = document.getElementById('soundBtn');
            btn.textContent = AudioSys.enabled ? '🔊' : '🔇';
            btn.classList.toggle('muted', !AudioSys.enabled);
        }

        // ==================== TIER PREVIEW ====================
        function createTierPreview() {
            const container = document.getElementById('tierPreview');
            EMOJI_TIERS.slice(0, 7).forEach((tier, index) => {
                const item = document.createElement('div');
                item.className = 'tier-item';
                item.innerHTML = `
                    <div class="tier-emoji" style="border-color: ${tier.color}; box-shadow: 0 0 10px ${tier.color}40;">${tier.emoji}</div>
                    <div class="tier-value">${tier.value}</div>
                `;
                container.appendChild(item);
            });
        }

        // ==================== INITIALIZATION ====================
        window.onload = () => {
            Game.init();
            createTierPreview();

            // Handle window resize
            window.addEventListener('resize', () => {
                Game.resize();
            });
        };

        // Prevent zoom on double tap
        document.addEventListener('dblclick', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
